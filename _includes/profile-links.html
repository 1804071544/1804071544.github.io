{% comment %} Icon links to academic profiles, used in the hero and footer. {% endcomment %}
<span class="icon-links">
  {% if site.author.googlescholar %}<a href="{{ site.author.googlescholar }}" target="_blank" rel="noopener" title="Google Scholar" aria-label="Google Scholar"><i class="ai ai-google-scholar" aria-hidden="true"></i></a>{% endif %}
  {% if site.author.orcid %}<a href="{{ site.author.orcid }}" target="_blank" rel="noopener" title="ORCID" aria-label="ORCID"><i class="ai ai-orcid" aria-hidden="true"></i></a>{% endif %}
  {% if site.author.email %}<a href="mailto:{{ site.author.email }}" title="Email" aria-label="Email"><i class="fas fa-envelope" aria-hidden="true"></i></a>{% endif %}
</span>
